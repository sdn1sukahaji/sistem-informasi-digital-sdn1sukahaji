<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | SDN 1 Sukahaji</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS kita -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-5 col-lg-4">
                <div class="card card-soft p-4 p-md-5 border-0 rounded-4">
                    
                    <div class="text-center mb-4">
                        <i class="fas fa-graduation-cap text-primary-school fa-3x mb-2"></i>
                        <h3 class="fw-bold text-primary-school mb-0">Portal Login</h3>
                        <p class="text-muted small">SDN 1 Sukahaji</p>
                    </div>

                    <!-- Tempat munculnya pesan Error/Sukses -->
                    <div id="alertMessage" class="alert d-none text-center small" role="alert"></div>

                    <!-- Form Login -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="username" class="form-control border-start-0 ps-0" placeholder="NISN / NIP / Admin" required autocomplete="off">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="Masukkan Sandi" required>
                            </div>
                        </div>
                        
                        <button type="submit" id="btnLogin" class="btn btn-school w-100 py-2 mb-3 shadow-sm">
                            <span id="btnText">Masuk Sekarang</span>
                            <!-- Animasi Loading (Disembunyikan default) -->
                            <span id="btnLoading" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>

                    <div class="text-center">
                        <a href="index.html" class="text-decoration-none text-muted small"><i class="fas fa-arrow-left me-1"></i> Kembali ke Beranda</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Menghubungkan ke Mesin JS Kita -->
    <script src="js/app.js"></script>
</body>
</html>
