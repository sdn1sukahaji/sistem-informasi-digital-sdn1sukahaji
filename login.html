<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | SDN 1 Sukahaji</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS kita -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="col-md-5 col-lg-4">
                <div class="card card-soft p-4 p-md-5 border-0 rounded-4">
                    
                    <div class="text-center mb-4">
                        <i class="fas fa-graduation-cap text-primary-school fa-3x mb-2"></i>
                        <h3 class="fw-bold text-primary-school mb-0">Portal Login</h3>
                        <p class="text-muted small">SDN 1 Sukahaji</p>
                    </div>

                    <!-- Tempat munculnya pesan Error/Sukses -->
                    <div id="alertMessage" class="alert d-none text-center small" role="alert"></div>

                    <!-- Form Login -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="username" class="form-control border-start-0 ps-0" placeholder="NISN / NIP / Admin" required autocomplete="off">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="Masukkan Sandi" required>
                            </div>
                        </div>
                        
                        <button type="submit" id="btnLogin" class="btn btn-school w-100 py-2 mb-3 shadow-sm">
                            <span id="btnText">Masuk Sekarang</span>
                            <!-- Animasi Loading (Disembunyikan default) -->
                            <span id="btnLoading" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>

                    <div class="text-center">
                        <a href="index.html" class="text-decoration-none text-muted small"><i class="fas fa-arrow-left me-1"></i> Kembali ke Beranda</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Skrip Pengaman Login & SSO Terpadu -->
    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyfseRl94qmA0TaX1ODw3sr8Car6i0uf-3WEBKcJ8cDILdi459vW0CCqo28L3iGgHhVww/exec';
        const LOCKOUT_KEY = 'sdn1_sukahaji_login_lock';

        // 1. Cek jika sudah ada sesi aktif, langsung arahkan ke dashboard
        const existingSession = localStorage.getItem('userSession');
        if (existingSession) {
            try {
                const u = JSON.parse(existingSession);
                if (u && u.username) {
                    localStorage.setItem('sdn1_sso_user', u.username);
                    if (u.sso_token) localStorage.setItem('sdn1_sso_token', u.sso_token);
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {}
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Proteksi Brute-Force (Kunci 60 detik jika 5x salah)
            let lockData = JSON.parse(localStorage.getItem(LOCKOUT_KEY) || '{"count":0,"until":0}');
            if (Date.now() < lockData.until) {
                let sisaDetik = Math.ceil((lockData.until - Date.now()) / 1000);
                showAlert(`Terlalu banyak percobaan gagal. Silakan tunggu ${sisaDetik} detik lagi.`, 'alert-danger');
                return;
            }

            const usernameVal = document.getElementById('username').value.trim();
            const passwordVal = document.getElementById('password').value.trim();
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const btnLogin = document.getElementById('btnLogin');

            btnText.classList.add('d-none');
            btnLoading.classList.remove('d-none');
            btnLogin.disabled = true;

            const url = `${API_URL}?action=login&username=${encodeURIComponent(usernameVal)}&password=${encodeURIComponent(passwordVal)}&_t=${Date.now()}`;

            fetch(url)
            .then(r => r.json())
            .then(res => {
                btnText.classList.remove('d-none');
                btnLoading.classList.add('d-none');
                btnLogin.disabled = false;

                if (res.status === 'success' && res.data) {
                    localStorage.removeItem(LOCKOUT_KEY);

                    // Simpan Sesi Utama & Token SSO
                    localStorage.setItem('userSession', JSON.stringify(res.data));
                    localStorage.setItem('sdn1_sso_user', res.data.username || usernameVal);
                    if (res.data.sso_token) {
                        localStorage.setItem('sdn1_sso_token', res.data.sso_token);
                    }

                    window.location.href = 'dashboard.html';
                } else {
                    lockData.count = (lockData.count || 0) + 1;
                    if (lockData.count >= 5) {
                        lockData.until = Date.now() + 60000;
                        lockData.count = 0;
                    }
                    localStorage.setItem(LOCKOUT_KEY, JSON.stringify(lockData));
                    showAlert(res.message || 'Username atau Password salah!', 'alert-danger');
                }
            })
            .catch(() => {
                btnText.classList.remove('d-none');
                btnLoading.classList.add('d-none');
                btnLogin.disabled = false;
                showAlert('Gagal terhubung ke server. Periksa koneksi internet Anda.', 'alert-danger');
            });
        });

        function showAlert(msg, className) {
            const alertBox = document.getElementById('alertMessage');
            alertBox.className = `alert text-center small ${className}`;
            alertBox.textContent = msg;
            alertBox.classList.remove('d-none');
        }
    </script>
</body>
</html>
